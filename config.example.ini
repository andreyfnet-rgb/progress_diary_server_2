; Copy this file to config.ini (next to this file, project root) and fill
; in real values. config.ini is not meant to be committed with real
; credentials -- keep it out of version control on the actual hosting
; deploy the same way prop.ini was kept out of the old repo's shipped code.

[db]
host = 127.0.0.1
port = 3306
name = gdpd_dev
user = root
pass =
; Known-empty in the current production prop.ini too -- tracked
; separately, not something this rewrite silently "fixes".
apikey =

[salary_db]
; Separate database, mirroring the original's separate 1cdbgdsweek1c.mdb
; file (prop.ini's [db] path_sal) -- see migrations/salary_schema.sql.
host = 127.0.0.1
port = 3306
name = gdpd_salary_dev
user = root
pass =

[html]
; Served raw for any request path that doesn't match a known API route,
; mirroring the legacy DefaultHandler (WbMdul.dfm, Default=True).
firstpage = 1.html

[sms]
; Only the currently-active SMS gateway (used by getpass for password
; recovery) is configured here -- see SmsGateway.php for why the older
; mcommunicator.ru path was left out entirely.
apiurl_new = https://omnichannel.mts.ru/http-api/v1/messages
log_new =
pass_new =
smstext = Ваш пароль

[DBin]
; 1C schedule export -- see Schedule1cSyncService.php and
; tools/sync-schedule-1c.php. url must end in a slash; the script appends
; "ExportSchedule?Date=yyyymmdd" itself.
url =
l =
p =

; Further 1C servers: any [DBin_<name>] section is synced too. Their ids are
; stored as "<name>:<id>" (clubs.clb_id1c, Client.cln_id1c) so they can't
; clash with Moscow's. l/p may be left out to reuse [DBin]'s.
[DBin_ekb]
url = http://1c.galladance.com:9102/Ekb/

[DBin_perm]
url = http://1c.galladance.com:9102/Perm/
